[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-agent"
version = "0.1.0"
description = "Harness-first SDLC control plane (experimental MVP)"
requires-python = ">=3.12"
dependencies = ["fastapi==0.128.2", "pydantic==2.13.5", "uvicorn==0.38.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1", "email-validator==2.3.0"]

[tool.setuptools.packages.find]
include = ["atomic_agent*"]
