name: Python control-plane tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Frozen fixture integrity
        run: python scripts/check_frozen.py
      - name: Intentional baseline test
        run: python scripts/check_baseline.py
      - name: Control-plane tests
        run: python -m pytest -q tests/unit tests/integration
